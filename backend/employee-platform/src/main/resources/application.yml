spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

refresh:
  expiration: ${REFRESH_EXPIRATION:2592000000}

logging:
  level:
    root: INFO
    com.ronitech.employee_platform: DEBUG
    org.hibernate.SQL: DEBUG # don't use it in production 
  file:
    name: logs/employee-platform.log

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
      
password-reset:
  expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

app:
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}

server:
  port: 8080
