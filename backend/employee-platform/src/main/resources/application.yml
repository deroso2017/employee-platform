spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

refresh:
  expiration: ${REFRESH_EXPIRATION:2592000000}

logging:
  level:
    root: INFO
    com.ronitech.employee_platform: DEBUG
    org.hibernate.SQL: DEBUG # don't use it in production 
  file:
    name: logs/employee-platform.log

server:
  port: 8080
